<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>على أرضك تنبض قلوبنا</title>
<style>
:root{--bg:#f7f1e3;--card:#fffaf0;--ink:#0f3d2a;--gold:#a9822f;--map:#e6dcc0;--line:#1c5a3f;--heart:#c0392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1f17;--card:#14301f;--ink:#f1e8cf;--gold:#d8b45e;--map:#1b3a2a;--line:#d8b45e;--heart:#ff6b6b}}
:root[data-theme="dark"]{--bg:#0d1f17;--card:#14301f;--ink:#f1e8cf;--gold:#d8b45e;--map:#1b3a2a;--line:#d8b45e;--heart:#ff6b6b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Tajawal","Segoe UI",Tahoma,sans-serif;text-align:center;padding:16px}
h1{margin:8px 0 2px;font-size:clamp(26px,7vw,44px)}
h1 span{color:var(--gold)}
p.sub{margin:0 auto 12px;max-width:520px;opacity:.85;line-height:1.7}
.count{display:inline-block;background:var(--card);border:1px solid var(--gold);border-radius:20px;padding:4px 14px;margin-bottom:8px;font-size:14px}
svg{width:100%;max-width:640px;height:auto;display:block;margin:0 auto}
.land{fill:var(--map);stroke:var(--line);stroke-width:2.5;stroke-linejoin:round}
.h{cursor:pointer;transform-box:fill-box;transform-origin:center;animation:pop .6s ease-out both,beat 2.4s ease-in-out .6s infinite}
.h:hover{filter:brightness(1.2)}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
form{max-width:520px;margin:12px auto;background:var(--card);border:1px solid var(--gold);border-radius:16px;padding:14px}
textarea,input{width:100%;font:inherit;padding:10px;border-radius:10px;border:1px solid var(--gold);background:transparent;color:var(--ink);margin-bottom:8px}
textarea{height:84px;resize:none}
button{font:inherit;background:var(--ink);color:var(--bg);border:0;border-radius:12px;padding:10px 22px;cursor:pointer}
button:disabled{opacity:.5}
small{opacity:.7}
#modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:20px;z-index:9}
#modal.on{display:flex}
.box{background:var(--card);border:2px solid var(--gold);border-radius:20px;padding:24px;max-width:420px;width:100%}
.box .heart{font-size:34px;color:var(--heart)}
#mt{font-size:20px;line-height:1.8;margin:8px 0;white-space:pre-wrap;word-break:break-word}
#mn{color:var(--gold);margin-bottom:14px}
</style>
</head>
<body>
<p class="sub" style="font-weight:700">🇸🇦 مبادرة وطنية للمعلمات</p>
<h1>على <span>أرضك</span> تنبض قلوبنا</h1>
<p class="sub">من قلب معلمة إلى وطنها... كلمات وفاء تنبض حبًا وانتماءً</p>
<h2 style="margin:14px 0 4px;font-size:22px">نبضات الوفاء على أرض الوطن 💚</h2>
<p class="sub">اضغطي على أي قلب لتقرئي رسالة من القلب للوطن</p>
<div class="count">❤ <b id="n">0</b> رسالة</div>
<svg id="map" viewBox="0 0 600 480" aria-label="خريطة المملكة العربية السعودية">
<path id="land" class="land"/>
<text x="300" y="455" text-anchor="middle" fill="var(--gold)" font-size="16">السعودية • دار العز والفخر</text>
<g id="hearts"></g>
</svg>
<form id="f">
<textarea id="t" maxlength="140" placeholder="دعوة • شعور • كلمة من القلب..." required></textarea>
<input id="nm" maxlength="30" placeholder="اسمك (اختياري)">
<button id="b" type="submit">ارسمي قلبي 💚</button>
<div><small id="msg"></small></div>
</form>
<div id="modal"><div class="box"><div class="heart">❤</div><div id="mt"></div><div id="mn"></div><button id="del" style="display:none;margin-inline-end:8px;background:var(--heart);color:#fff">حذف قلبي</button><button id="x">إغلاق</button></div></div>
<script>
const LL=[[34.95,29.35],[36.0,29.2],[37.0,29.9],[38.0,30.5],[39.0,32.0],[40.0,31.9],[42.0,31.1],[44.7,29.2],[46.5,29.1],[47.6,28.5],[48.4,28.0],[48.8,27.5],[49.6,26.9],[50.1,26.2],[50.2,25.5],[50.8,24.8],[51.3,24.3],[51.6,24.3],[52.6,22.9],[55.2,22.7],[55.0,20.0],[52.0,19.0],[49.0,18.0],[47.0,17.4],[44.5,17.4],[43.2,17.3],[42.8,16.4],[42.7,17.0],[41.8,17.8],[41.0,19.5],[40.0,20.5],[39.1,21.5],[39.0,22.5],[38.5,23.8],[37.4,25.2],[36.5,26.3],[35.5,27.8],[34.9,28.2]];
const P=LL.map(([lo,la])=>[(lo-34)*26+20,(33-la)*26+10]);
document.getElementById('land').setAttribute('d','M'+P.map(p=>p.join(',')).join('L')+'Z');
const inside=(x,y)=>{let c=false;for(let i=0,j=P.length-1;i<P.length;j=i++){const[a,b]=P[i],[d,e]=P[j];if((b>y)!==(e>y)&&x<(d-a)*(y-b)/(e-b)+a)c=!c}return c};
const NS='http://www.w3.org/2000/svg',G=document.getElementById('hearts');
let items=[],shown=new Set(),db=null,cur=null;const mine=()=>{try{return JSON.parse(localStorage.getItem('mine')||'[]')}catch(e){return[]}};const keep=id=>{try{localStorage.setItem('mine',JSON.stringify([...mine(),id]))}catch(e){}};function drop(id){shown.delete(id);const i=items.findIndex(a=>a.id===id);if(i>=0){items[i].el&&items[i].el.remove();items.splice(i,1)}n.textContent=shown.size}
function place(){let best=null,bd=-1;for(let k=0;k<80;k++){const x=20+Math.random()*560,y=10+Math.random()*440;if(!inside(x,y))continue;const d=items.length?Math.min(...items.map(i=>Math.hypot(i.x-x,i.y-y))):999;if(d>bd){bd=d;best={x,y}}}return best||{x:300,y:250}}
function draw(it){if(shown.has(it.id))return;shown.add(it.id);const g=document.createElementNS(NS,'path');
const X=it.x,Y=it.y;g.setAttribute('d','M'+X+','+(Y+8.4)+' C'+(X-16.8)+','+(Y-5.6)+' '+(X-11.2)+','+(Y-19.6)+' '+X+','+(Y-11.2)+' C'+(X+11.2)+','+(Y-19.6)+' '+(X+16.8)+','+(Y-5.6)+' '+X+','+(Y+8.4)+'Z');
g.setAttribute('fill',it.id.charCodeAt(0)%3?'var(--heart)':'var(--gold)');g.setAttribute('class','h');g.setAttribute('role','button');
g.onclick=()=>{cur=it;mt.textContent=it.text;mn.textContent=it.name?'— '+it.name:'';del.style.display=mine().includes(it.id)?'':'none';modal.classList.add('on')};it.el=g;G.appendChild(g);n.textContent=shown.size}
function add(it){items.push(it);draw(it)}
x.onclick=()=>modal.classList.remove('on');del.onclick=async()=>{if(!cur)return;const id=cur.id;try{await api({a:'del',id});drop(id);modal.classList.remove('on')}catch(e){mt.textContent='تعذّر الحذف'}};modal.onclick=e=>{if(e.target===modal)modal.classList.remove('on')};
f.onsubmit=async e=>{e.preventDefault();const text=t.value.trim();if(!text)return;b.disabled=true;
const p=place(),id=Date.now().toString(36)+Math.random().toString(36).slice(2,6),it={id,text,name:nm.value.trim(),x:p.x,y:p.y};
try{await api({a:'add',id,text:it.text,name:it.name,x:it.x,y:it.y});add(it);keep(id);
msg.textContent='شكراً لك، تم إضافة قلبك 💚';t.value='';nm.value=''}catch(err){msg.textContent='تعذّر الإرسال، حاولي مرة ثانية'}b.disabled=false};
const URL_='PASTE_URL_HERE';
const api=async b=>{if(!URL_.startsWith('http'))return;const r=await fetch(URL_,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(b)});if(!r.ok)throw 0};
async function load(){if(!URL_.startsWith('http')){msg.textContent='ملاحظة: الرسائل هنا تظهر لك فقط حالياً.';return}
try{const r=await (await fetch(URL_)).json(),ids=new Set(r.map(v=>String(v.id)));
r.forEach(v=>{if(!shown.has(String(v.id)))add({id:String(v.id),text:String(v.text||''),name:String(v.name||''),x:+v.x,y:+v.y})});
[...shown].forEach(id=>{if(!ids.has(id))drop(id)})}catch(e){}}
load();setInterval(load,20000);
</script>
</body>
</html>
